<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transition</title>
  <link rel="stylesheet" href="./19_Transition.css">
</head>

<body>
  <!-- !Example 1 -->
  <!-- <div id="circle"></div> -->
  <!-- !Example 2 -->
   <div class="box">
    <h2>Ease</h2>
    <div class="line">
      <div class="ball ease"></div>
    </div>
   </div>
   <div class="box">
    <h2>Ease-In</h2>
    <div class="line">
      <div class="ball ease-in"></div>
    </div>
   </div>
   <div class="box">
    <h2>Ease-Out</h2>
    <div class="line">
      <div class="ball ease-out"></div>
    </div>
   </div>
   <div class="box">
    <h2>Ease-In-Out</h2>
    <div class="line">
      <div class="ball ease-in-out"></div>
    </div>
   </div>
   <div class="box">
    <h2>Linear</h2>
    <div class="line">
      <div class="ball linear"></div>
    </div>
   </div>
   <div class="box">
    <h2>Steps</h2>
    <div class="line">
      <div class="ball steps"></div>
    </div>
   </div>
</body>

</html>
