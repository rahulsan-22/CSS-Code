<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    h2 {
      color: white;
      background-color: red;
    }
    p {
      color: yellow;
      background-color: green;
    }
  </style>
  <link rel="stylesheet" href="./01_WaysOfAddingCss.css">
</head>
<body>
  <!-- !INLINE CSS -->
  <h1 style="color:white;background-color:black;">Feeling Hungry ?</h1>
  <button style="color:white;background-color: blue;">Click</button>
  <hr>
  <!-- !INTERNAL CSS -->
  <h2>Boys at the back please concentrate</h2>
  <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Repudiandae tempora, eligendi doloremque sunt assumenda
    dicta officia odio quae debitis ab!</p>
  <hr>
  <!-- !EXTERNAL CSS -->
  <input type="text" placeholder="Enter your name">
  <textarea rows="10" cols="50"></textarea>
</body>

</html>
