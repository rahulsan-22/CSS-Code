<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PseudoClassSelectors</title>
  <link rel="stylesheet" href="./04_PseudoClassSelectors.css">
</head>

<body>
  <!-- ! :HOVER -->
  <h1>Hello Guys How are you ?</h1>
  <button id="btn">Hover</button>
  <hr>
  <!-- ! :FOCUS -->
  <input type="email" placeholder="Enter your email">
  <input type="password" placeholder="Enter your password">
  <hr>
  <!-- ! :ACTIVE and :VISITED -->
  <a href="https://www.flipkart.com">Flipkart</a>
  <a href="https://www.amazon.com">Amazon</a>
  <a href="https://www.myntra.com">Myntra</a>
  <hr>
  <!-- ! :FIRST-CHILD , :LAST-CHILD , :NTH-CHILD() -->
  <div>
    <p>Para - 1</p>
    <p>Para - 2</p>
    <p>Para - 3</p>
    <p>Para - 4</p>
    <p>Para - 5</p>
    <p>Para - 6</p>
    <p>Para - 7</p>
    <p>Para - 8</p>
    <p>Para - 9</p>
    <p>Para - 10</p>
  </div>
  <hr>
  <!-- ! :CHECKED -->
  <form>
    <label>Gender:</label>
    <input type="radio" name="gender" id="male">
    <label for="male">Male</label>
    <input type="radio" name="gender" id="female">
    <label for="female">Female</label>
  </form>
  <hr>
  <!-- ! :NOT -->
  <ul>
    <li>Rahul</li>
    <li>Pavan</li>
    <li class="exclude">Monty</li>
    <li>Deva</li>
  </ul>
</body>

</html>
