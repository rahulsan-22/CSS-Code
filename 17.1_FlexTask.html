<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex Task</title>
  <link rel="stylesheet" href="./17.1_FlexTask.css">
</head>
<body>
  <nav>
    <aside id="nav_one">
      <h2>TechStore</h2>
    </aside>
    <aside id="nav_two">
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">Contact</a>
    </aside>
  </nav>
  <header>
    <h2>🔥 Flat 20% OFF Today Only</h2>
  </header>
  <section>
    <aside id="section_one">
      <main id="card">
         <div id="offer">20% OFF</div>
         <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="shoes">
         <div id="new">New</div>
         <h2>Nike Running Shoes</h2>
         <h3>₹1,999</h3>
         <button>Buy Now</button>
      </main>
    </aside>
    <aside id="section_two">
      <div id="sales">SALES</div>
      <div id="limited_offer">LIMITED OFFER</div>
    </aside>
  </section>
  <div id="chat">💬</div>
</body>
</html>
