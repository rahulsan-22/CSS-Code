<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Position Task</title>
  <link rel="stylesheet" href="./16.1_PositionTask.css">
</head>

<body>
  <!-- !NAVBAR -->
  <nav>
    <h2>TechStore</h2>
    <div class="links">
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">Contact</a>
    </div>
  </nav>
  <!-- !HEADER -->
  <header>
    <h2>🔥 Flat 20% OFF Today Only</h2>
  </header>
  <!-- !SECTION -->
   <section>
    <div class="card">
      <div id="offer">20% OFF</div>
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="shoes">
      <div id="new">New</div>
      <h2>Nike Running Shoes</h2>
      <h3>₹1,999</h3>
      <button>Buy Now</button>
    </div>
    <div id="sales" class="dabba">SALES</div>
    <div id="limitedOffer" class="dabba">LIMITED OFFER</div>
    <div id="chat">💬</div>
   </section>
</body>
</html>
