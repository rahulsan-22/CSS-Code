<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Selectors 🧡</title>
  <link rel="stylesheet" href="./02_SimpleSelectors.css">
</head>

<body>
  <!-- !PRIORTIES -->
    <a href="#" id="google" class="link">Google</a>
   <hr>
  <!-- ! ELEMENT -->
  <input type="text" placeholder="Enter your name">
  <input type="email" placeholder="Enter your email">
  <input type="password" placeholder="Enter your password">
  <hr>
  <!-- !ID (#) -->
  <h1 id="myLove">Anushka Shetty</h1>
  <h1>Kayadu Lohar</h1>
  <h1>Bhagyashree</h1>
  <hr>
  <!-- !CLASS (.) -->
  <h1 class="biryani fav">Chicken Biryani</h1>
  <p>Lorem ipsum dolor sit amet.</p>
  <h2 class="biryani">Mutton Biryani</h2>
  <p>Lorem ipsum dolor sit amet.</p>
  <h3 class="biryani">Prawns Biryani</h3>
  <p>Lorem ipsum dolor sit amet.</p>
  <hr>
  <!-- !GROUPING SELECTOR -->
  <h4>Good Morning.....</h4>
  <h5 id="late">Tinnara?</h5>
  <h6 class="traffic">Ninna Night Sariga Padukunara?</h6>
  <hr>
  <!-- !UNIVERSAL SELECTOR -->
  <textarea rows="10" cols="50"></textarea>
</body>
</html>
